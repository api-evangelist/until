aid: until
name: Until
description: >-
  Until (Until Labs) is a biotechnology company building the medical
  infrastructure to pause biological time. It is developing reversible
  cryopreservation systems for human organs, starting with organ-scale
  reversible cryopreservation to solve the donor-organ procurement and matching
  problem, and methodically scaling toward whole-body preservation. The lab
  translates the fundamentals of cryobiology into engineered workflows across
  five dimensions — perfusion, cryoprotectants, cooling, rewarming, and organ
  health assessment — using vitrification (glass, not ice) to prevent ice
  formation during preservation and safe rewarming. Founded by Laura Deming and
  Hunter Davis, Until has raised $100M+ to date and is backed by Founders Fund.
  Until is a research-and-development company with no public API surface; this
  profile captures its identity and public web properties for the API Evangelist
  network.
